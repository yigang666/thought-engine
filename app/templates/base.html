<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Thought Engine{% endblock %}</title>
  <style>html{background:#f7f6f4}</style>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-row">
        <a class="brand" href="/">Thought Engine</a>
        <div class="account">
          {% if user %}
          <span class="account-name">{{ user.name }}</span>
          <span class="account-email">{{ user.email }}</span>
          <form method="post" action="/auth/logout">
            <button class="secondary" type="submit">Sign out</button>
          </form>
          {% else %}
          <a class="button" href="/auth/google">Sign in with Google</a>
          {% endif %}
        </div>
      </div>
      <nav class="nav" aria-label="Site">
        <a href="/" {% if nav == 'articles' %}aria-current="page"{% endif %}>Articles</a>
        {% if user %}
        <a href="/upload" {% if nav == 'upload' %}aria-current="page"{% endif %}>Upload</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Anyone can read published articles. Uploading an article or a Markdown file requires Google sign-in.</p>
  </footer>
</body>
</html>
